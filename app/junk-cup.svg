<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Junk Cup">
  <title>Junk Cup</title>
  <!-- The Junk Cup: a trophy flying the club's junk sail, with the ball mid-bounce. Club colours. -->
  <defs>
    <!-- a cream edge around the artwork, so it reads on navy as well as on cream -->
    <filter id="halo" x="-10%" y="-10%" width="120%" height="120%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="4.5" result="grow"/>
      <feFlood flood-color="#FFF6E5"/><feComposite in2="grow" operator="in" result="edge"/>
      <feMerge><feMergeNode in="edge"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- brush strokes behind, like the banner -->
    <path d="M22 196 C70 176 150 170 222 150" stroke="#13A5C5" stroke-width="16" opacity=".9"/>
    <path d="M14 172 C60 150 96 146 128 138" stroke="#FF6729" stroke-width="11" opacity=".95"/>
    <path d="M150 210 C176 204 204 196 228 184" stroke="#FFC83D" stroke-width="8"/>
  </g>
  <g filter="url(#halo)">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- mast and junk sail -->
    <path d="M112 118 L112 22" stroke="#092D4A" stroke-width="7"/>
    <path d="M112 24 C86 30 62 46 50 70 L112 78 Z" fill="#FF6729" stroke="#092D4A" stroke-width="6"/>
    <path d="M50 76 C42 88 38 100 38 112 L112 112 L112 84 Z" fill="#FF6729" stroke="#092D4A" stroke-width="6"/>
    <path d="M112 30 C128 34 142 44 150 58 L112 66 Z" fill="#F2581C" stroke="#092D4A" stroke-width="6"/>
    <path d="M112 72 L154 66 C160 80 162 94 160 108 L112 108 Z" fill="#F2581C" stroke="#092D4A" stroke-width="6"/>
    <path d="M70 50 L112 54 M58 94 L112 96 M112 48 L138 46 M112 90 L158 88" stroke="#092D4A" stroke-width="3.5"/>

    <!-- handles -->
    <path d="M62 128 C36 128 34 166 66 168" stroke="#092D4A" stroke-width="17"/>
    <path d="M62 128 C36 128 34 166 66 168" stroke="#FFC83D" stroke-width="7"/>
    <path d="M162 128 C188 128 190 166 158 168" stroke="#092D4A" stroke-width="17"/>
    <path d="M162 128 C188 128 190 166 158 168" stroke="#FFC83D" stroke-width="7"/>

    <!-- cup -->
    <path d="M56 114 L168 114 C168 152 150 180 112 184 C74 180 56 152 56 114 Z" fill="#FFC83D" stroke="#092D4A" stroke-width="7"/>
    <path d="M72 126 C74 146 82 160 94 168" stroke="#FFF6E5" stroke-width="6" opacity=".9"/>
    <path d="M52 114 L172 114" stroke="#092D4A" stroke-width="9"/>
    <!-- stem and base -->
    <path d="M112 184 L112 204" stroke="#092D4A" stroke-width="16"/>
    <path d="M112 186 L112 202" stroke="#FFC83D" stroke-width="6"/>
    <path d="M78 206 L146 206 L152 224 L72 224 Z" fill="#092D4A" stroke="#092D4A" stroke-width="7"/>
    <path d="M94 215 L130 215" stroke="#FFF6E5" stroke-width="5"/>
  </g>

  <!-- the ball, mid-bounce -->
  <g>
    <circle cx="196" cy="70" r="27" fill="#FFC83D" stroke="#092D4A" stroke-width="7"/>
    <g fill="#092D4A">
      <ellipse cx="186" cy="60" rx="4.5" ry="4"/><ellipse cx="202" cy="56" rx="4.5" ry="4"/>
      <ellipse cx="208" cy="70" rx="4" ry="4.5"/><ellipse cx="194" cy="72" rx="4.5" ry="4.5"/>
      <ellipse cx="182" cy="76" rx="4" ry="4.5"/><ellipse cx="200" cy="86" rx="4.5" ry="4"/>
    </g>
    <path d="M176 56 C182 48 190 46 198 47" fill="none" stroke="#FFF6E5" stroke-width="3.5" stroke-linecap="round" opacity=".9"/>
  </g>

  <!-- star on the cup -->
  <path d="M112 128 l6.2 12.6 13.9 2 -10 9.8 2.4 13.8 -12.5 -6.5 -12.5 6.5 2.4 -13.8 -10 -9.8 13.9 -2 Z" fill="#FFF6E5" stroke="#092D4A" stroke-width="4.5" stroke-linejoin="round"/>
  </g>
</svg>
