<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#092D4A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Junk PB" />
  <title>Junk Pickleball</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="ball.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <script>
    // Apply the saved day/night choice before the page paints, so it never flashes.
    try { if (localStorage.getItem('jpb.theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  </script>
  <link rel="stylesheet" href="app.css" />
  <style>
    /* Opening screen: a ball smashes into the logo, then the logo slides up into
       the banner once the app is ready. Kept here so it paints before anything else. */
    .splash { position: fixed; inset: 0; z-index: 100; background: #FFF6E5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; overflow: hidden; }
    .splash-logo { position: relative; width: min(78vw, 360px); aspect-ratio: 1215 / 1043; }
    .splash-full { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transform-origin: 81% 23%; }
    .splash-fly, .splash-ring, .splash-dust { position: absolute; left: 81.1%; top: 23.4%; }
    .splash-fly { width: 20.8%; aspect-ratio: 1; translate: -50% -50%; opacity: 0; z-index: 3; }
    .splash-ring { width: 20%; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; border: 3px solid #FF6729; opacity: 0; }
    .splash-dust { width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; opacity: 0; }
    .splash-wait { height: 92px; display: grid; justify-items: center; align-content: start; gap: 10px; opacity: 0; }
    .splash-court { position: relative; width: 150px; height: 56px; }
    .splash-court::after { content: ""; position: absolute; left: 50%; bottom: 4px; width: 2px; height: 22px; background: #EBDFC9; }
    .splash-hx { position: absolute; left: 0; bottom: 0; width: 28px; height: 56px; animation: splash-x 1.3s linear infinite alternate; }
    .splash-hy { position: absolute; left: 0; bottom: 6px; width: 28px; height: 28px; animation: splash-y .65s cubic-bezier(.33,0,.66,0) infinite alternate-reverse; }
    .splash-hy img { width: 100%; height: 100%; display: block; animation: splash-spin 1.3s linear infinite; }
    .splash-shadow { position: absolute; left: 4px; bottom: 0; width: 20px; height: 5px; border-radius: 50%; background: rgba(9, 45, 74, .16); animation: splash-s .65s cubic-bezier(.33,0,.66,0) infinite alternate-reverse; }
    .splash-line { margin: 0; font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #5A6E80; transition: opacity .25s; }
    @keyframes splash-x { to { transform: translateX(122px); } }
    @keyframes splash-y { from { transform: translateY(-30px); } }
    @keyframes splash-s { from { transform: scaleX(.55); opacity: .5; } }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
    body.splash-reveal #view { animation: splash-rise .4s .1s cubic-bezier(.2, .7, .3, 1) both; }
    @keyframes splash-rise { from { opacity: 0; transform: translateY(16px); } }
  </style>
</head>
<body>
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-logo">
      <img class="splash-full" src="logo.svg" alt="" />
      <span class="splash-ring"></span>
      <img class="splash-fly" src="ball.svg" alt="" />
    </div>
    <div class="splash-wait">
      <div class="splash-court"><div class="splash-hx"><span class="splash-shadow"></span><div class="splash-hy"><img src="ball.svg" alt="" /></div></div></div>
      <p class="splash-line">Warming up…</p>
    </div>
  </div>
  <script>
    // Plays once when the app opens. app.js calls jpbSplash.ready() once the
    // first screen is drawn; the logo then slides up into the banner. If the
    // sheet is slow, a ball rallies under the logo until then.
    (function () {
      var el = document.getElementById('splash');
      var $ = function (s) { return el.querySelector(s); };
      var logo = $('.splash-logo'), full = $('.splash-full'), fly = $('.splash-fly'), ring = $('.splash-ring'), wait = $('.splash-wait'), line = $('.splash-line');
      var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      var canAnimate = !!el.animate && !reduce;
      var LINES = ['Warming up…', 'Counting who bailed…', 'Blaming the paddle…', 'Checking the kitty…', 'Finding a fourth…', 'Arguing about the kitchen line…'];
      var introDone = false, appReady = false, gone = false, timers = [];
      var later = function (ms, fn) { timers.push(setTimeout(fn, ms)); };
      var fx = function (n, frames, opts) { opts.fill = opts.fill || 'forwards'; return n.animate(frames, opts); };
      var dust = ['#FF6729', '#FFC83D', '#13A5C5', '#092D4A', '#FF6729', '#FFC83D', '#13A5C5', '#FF6729'].map(function (c) {
        var d = document.createElement('span'); d.className = 'splash-dust'; d.style.background = c; logo.appendChild(d); return d;
      });

      function smash() {
        fx(fly, [
          { opacity: 1, transform: 'translate(-420%, 520%) scale(2.6) rotate(-540deg)' },
          { opacity: 1, transform: 'translate(-170%, -110%) scale(1.7) rotate(-200deg)', offset: .55 },
          { opacity: 1, transform: 'translate(0, 0) scale(1) rotate(0deg)' }
        ], { duration: 480, easing: 'cubic-bezier(.35, .05, .55, 1)' });
        later(480, function () {
          fx(fly, [{ transform: 'scale(1.3, .72)', opacity: 1 }, { transform: 'scale(.95, 1.05)', opacity: 1, offset: .5 }, { transform: 'scale(1)', opacity: 0 }], { duration: 260, easing: 'ease-out' });
          fx(full, [
            { opacity: 0, transform: 'scale(.5)' },
            { opacity: 1, transform: 'scale(1.13, 1.06)', offset: .35 },
            { opacity: 1, transform: 'scale(.95, .99)', offset: .6 },
            { opacity: 1, transform: 'scale(1.02)', offset: .8 },
            { opacity: 1, transform: 'scale(1)' }
          ], { duration: 600, easing: 'ease-out' });
          fx(logo, [{ transform: 'none' }, { transform: 'translate(-5px, 3px)' }, { transform: 'translate(4px, -3px)' }, { transform: 'translate(-2px, 1px)' }, { transform: 'none' }], { duration: 260, fill: 'none' });
          fx(ring, [{ opacity: .8, transform: 'scale(.6)' }, { opacity: 0, transform: 'scale(3.2)' }], { duration: 480, easing: 'cubic-bezier(.2, .7, .3, 1)' });
          dust.forEach(function (d, i) {
            var a = (i / dust.length) * Math.PI * 2 + .3, r = 70 + (i % 3) * 22;
            fx(d, [{ opacity: 1, transform: 'translate(0, 0) scale(1)' }, { opacity: 0, transform: 'translate(' + Math.cos(a) * r + 'px, ' + Math.sin(a) * r + 'px) scale(.4)' }], { duration: 520, easing: 'cubic-bezier(.15, .7, .3, 1)' });
          });
        });
        later(850, function () { introDone = true; maybeLeave(); });
        later(1100, rally);
      }

      function rally() {
        if (gone) return;
        fx(wait, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 300 });
        var i = 0;
        (function next() {
          later(1600, function () {
            line.style.opacity = 0;
            later(250, function () { i = (i + 1) % LINES.length; line.textContent = LINES[i]; line.style.opacity = 1; next(); });
          });
        })();
      }

      function done() {
        el.remove();
        var hero = document.querySelector('#hero img');
        if (hero) hero.style.visibility = '';
        document.body.classList.add('splash-reveal');
      }

      function leave() {
        if (gone) return;
        gone = true;
        timers.forEach(clearTimeout);
        var hero = document.querySelector('#hero img');
        var b = hero && hero.getBoundingClientRect();
        if (!canAnimate || !b || !b.width || window.scrollY > 0) {
          if (!el.animate) return done();
          fx(el, [{ opacity: 1 }, { opacity: 0 }], { duration: 250 }).onfinish = done;
          return;
        }
        // slide the big logo into the banner, then let the app show around it
        var a = logo.getBoundingClientRect(), s = b.height / a.height;
        var dx = (b.left + b.width / 2) - (a.left + a.width / 2), dy = (b.top + b.height / 2) - (a.top + a.height / 2);
        hero.style.visibility = 'hidden';
        fx(wait, [{ opacity: getComputedStyle(wait).opacity }, { opacity: 0 }], { duration: 160 });
        fx(logo, [{ transform: 'none' }, { transform: 'translate(' + dx + 'px, ' + dy + 'px) scale(' + s + ')' }], { duration: 420, easing: 'cubic-bezier(.5, 0, .2, 1)' }).onfinish = done;
        fx(el, [{ backgroundColor: 'rgba(255, 246, 229, 1)' }, { backgroundColor: 'rgba(255, 246, 229, 0)' }], { duration: 340, delay: 120, easing: 'ease-out' });
      }

      function maybeLeave() { if (introDone && appReady) leave(); }
      window.jpbSplash = { ready: function () { appReady = true; maybeLeave(); } };
      setTimeout(function () { introDone = appReady = true; maybeLeave(); }, 12000);   // never get stuck here
      el.addEventListener('click', function () { introDone = true; maybeLeave(); });   // a tap skips the show

      if (!canAnimate) { full.style.opacity = 1; introDone = true; return; }
      // wait (briefly) for the pictures, so the ball never lands on an empty space
      var pics = [full, fly].map(function (img) { return img.decode ? img.decode().catch(function () {}) : null; });
      Promise.race([Promise.all(pics), new Promise(function (r) { setTimeout(r, 900); })]).then(smash);
    })();
  </script>
  <!-- Compact bar. Over the big logo banner it is see-through; once the banner
       has scrolled away (or on other tabs) it turns solid and shows the name. -->
  <header class="topbar" id="topbar">
    <div class="brand"><img class="brand-mark" src="ball.svg" alt="" width="30" height="30" /><span id="clubName">Junk Pickleball</span></div>
    <div class="topbar-actions">
      <a class="icon-btn" href="../" data-action="open-stats" aria-label="Club stats and bragging rights" title="Club stats">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 4h9v5.5a4.5 4.5 0 0 1-9 0z"/><path d="M7.5 6H5a2.5 2.5 0 0 0 2.6 4.2M16.5 6H19a2.5 2.5 0 0 1-2.6 4.2"/><path d="M12 14v3.5M8.5 20.5h7M9.5 17.5h5v3h-5z"/></svg>
      </a>
      <button class="icon-btn" data-action="toggle-theme" aria-label="Switch to night mode" title="Switch to night mode"></button>
      <button class="icon-btn" data-action="refresh" aria-label="Refresh" title="Refresh">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg>
      </button>
    </div>
  </header>

  <div class="hero" id="hero"><img src="logo.svg" alt="Junk Pickleball" /></div>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="sessions" class="active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h2M14 14h2M8 17.2h2" /></svg>Sessions</button>
    <button data-tab="bills">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3h8l4 4v12.5a1.5 1.5 0 0 1-1.5 1.5h-10.5A1.5 1.5 0 0 1 5 19.5v-15A1.5 1.5 0 0 1 6.5 3z"/><path d="M14.5 3v4h4M8.5 12h7M8.5 15.5h7M8.5 8.5h3"/></svg>Court Fees</button>
    <button data-tab="club">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3.2"/><path d="M3 19.5c.4-3.3 2.9-5.3 6-5.3s5.6 2 6 5.3"/><circle cx="17" cy="9.5" r="2.5"/><path d="M16.8 14.3c2.3.2 3.9 1.9 4.2 4.4"/></svg>Club</button>
  </nav>

  <div id="sheet" class="sheet" hidden></div>
  <div id="busy" class="busy" role="status" aria-live="assertive" hidden>
    <div class="busy-card">
      <div class="busy-court" aria-hidden="true"><img class="busy-ball" src="ball.svg" alt="" width="64" height="64" /><span class="busy-shadow"></span></div>
      <div id="busyText" class="busy-text">Saving…</div>
      <div id="busySub" class="busy-sub"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script>
    // Always run the latest version. Phones hold on to old copies of the app's
    // files, so before loading them we ask the server (a tiny request each,
    // never cached) what the current version of each file is, and load that
    // exact version. With no connection it falls back to whatever is saved.
    (function () {
      var files = ['config.js', 'billing.js', 'tournament.js', 'app.js'];
      var css = 'app.css';
      function version(file) {
        return fetch(file, { method: 'HEAD', cache: 'no-store' })
          .then(function (r) { return (r.headers.get('etag') || r.headers.get('last-modified') || '').replace(/[^a-zA-Z0-9]/g, ''); })
          .catch(function () { return ''; });
      }
      function withTimeout(p) {
        return Promise.race([p, new Promise(function (res) { setTimeout(function () { res(null); }, 2500); })]);
      }
      function load(versions) {
        versions = versions || [];
        var v = function (i) { return versions[i] ? '?v=' + versions[i] : ''; };
        if (versions[files.length]) {
          var link = document.querySelector('link[rel="stylesheet"][href^="app.css"]');
          if (link) link.href = css + '?v=' + versions[files.length];
        }
        files.forEach(function (f, i) {
          var el = document.createElement('script');
          el.src = f + v(i);
          el.async = false;   // keep them in order
          document.body.appendChild(el);
        });
      }
      withTimeout(Promise.all(files.concat(css).map(version))).then(load, function () { load(); });
    })();
  </script>
</body>
</html>
